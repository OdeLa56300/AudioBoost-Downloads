<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AudioBoost – Améliorez votre audio</title>

<meta name="description" content="Découvrez AudioBoost et écoutez gratuitement la différence sur un morceau avant de vous abonner.">

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#030309;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.page{
    position:relative;
    width:auto;
    height:100vh;
    max-width:100vw;
    aspect-ratio:3/2;
    line-height:0;
}

.page img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
}

.hotspot{
    position:absolute;
    display:block;
    text-decoration:none;
    cursor:pointer;
}

.buy{
    left:67.1%;
    top:37.0%;
    width:30.3%;
    height:10.8%;
    border-radius:50px;
}

.download{
    left:66.0%;
    top:61.0%;
    width:31.5%;
    height:11.8%;
    border-radius:22px;
}

.manage{
    left:66.0%;
    top:74.6%;
    width:31.5%;
    height:11.7%;
    border-radius:22px;
}

/* Bouton essai gratuit */
.demo-button{
    position:fixed;
    left:28px;
    bottom:28px;
    z-index:20;

    padding:15px 24px;
    border:none;
    border-radius:30px;

    background:linear-gradient(90deg,#4d91ff,#a264ff,#ef4bc5);
    color:#ffffff;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 18px rgba(77,145,255,.35),
        0 0 28px rgba(239,75,197,.20);

    transition:transform .2s,box-shadow .2s;
}

.demo-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 24px rgba(77,145,255,.50),
        0 0 35px rgba(239,75,197,.30);
}

/* Fenêtre de démonstration */
.demo-overlay{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    background:rgba(0,0,0,.78);

    justify-content:center;
    align-items:center;

    padding:20px;
    box-sizing:border-box;
}

.demo-overlay.active{
    display:flex;
}

.demo-box{
    position:relative;

    width:min(620px,92vw);

    padding:32px;

    box-sizing:border-box;

    background:#0b0b16;

    border:1px solid rgba(162,100,255,.55);
    border-radius:24px;

    box-shadow:
        0 0 35px rgba(77,145,255,.25),
        0 0 60px rgba(239,75,197,.15);

    color:#e9e5ff;

    line-height:1.4;
}

.demo-title{
    margin:0 0 8px;

    font-size:28px;

    background:linear-gradient(90deg,#4d91ff,#a264ff,#ef4bc5);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.demo-subtitle{
    margin:0 0 25px;
    color:#aaa5c5;
    font-size:15px;
}

.demo-track{
    margin-bottom:22px;
}

.demo-track-title{
    margin-bottom:8px;
    font-size:16px;
    font-weight:bold;
}

.demo-track-title.original{
    color:#4d91ff;
}

.demo-track-title.boost{
    color:#ef4bc5;
}

.demo-track audio{
    width:100%;
}

.demo-buy{
    display:block;
    margin:25px auto 0;

    padding:13px 28px;

    border-radius:28px;

    background:linear-gradient(90deg,#4d91ff,#ef4bc5);

    color:#ffffff;
    text-decoration:none;

    text-align:center;
    font-weight:bold;

    box-shadow:0 0 20px rgba(162,100,255,.30);
}

.demo-close{
    position:absolute;
    top:12px;
    right:16px;

    border:none;
    background:none;

    color:#aaa5c5;

    font-size:28px;
    cursor:pointer;
}

.demo-close:hover{
    color:#ef4bc5;
}

@media(max-width:600px){
    .demo-button{
        left:15px;
        bottom:15px;
        padding:12px 18px;
        font-size:14px;
    }

    .demo-box{
        padding:24px 20px;
    }

    .demo-title{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="page">

    <img
        src="AudioBoost-Presentation.png"
        alt="Présentation AudioBoost"
    >

    <a
        class="hotspot buy"
        href="https://buy.stripe.com/aFafZb0cS4Aq2C83UogrS01"
        aria-label="Acheter AudioBoost">
    </a>

    <a
        class="hotspot download"
        https://github.com/OdeLa56300/AudioBoost-Downloads/releases/download/v1.1.0/AudioBoost_Setup.exe
        aria-label="Télécharger AudioBoost">
    </a>

    <a
        class="hotspot manage"
        href="https://billing.stripe.com/p/login/6oU3cp7Fkff40u09eIgrS00"
        aria-label="Gérer mon abonnement">
    </a>

</div>

<!-- Bouton essai -->
<button
    class="demo-button"
    onclick="openDemo()">
    🎧 ESSAYER GRATUITEMENT
</button>


<!-- Fenêtre de démonstration -->
<div
    id="demoOverlay"
    class="demo-overlay"
    onclick="closeDemoOutside(event)">

    <div class="demo-box">

        <button
            class="demo-close"
            onclick="closeDemo()"
            aria-label="Fermer">
            ×
        </button>

        <h2 class="demo-title">
            Découvrez AudioBoost
        </h2>

        <p class="demo-subtitle">
            Écoutez la différence sur un morceau réel avant de choisir votre abonnement.
        </p>

        <div class="demo-track">

            <div class="demo-track-title original">
                🎵 Original
            </div>

            <audio controls preload="none">
                <source
                    src="Eve-leve-toi_Original_Demo.mp3"
                    type="audio/mpeg">
                Votre navigateur ne prend pas en charge la lecture audio.
            </audio>

        </div>


        <div class="demo-track">

            <div class="demo-track-title boost">
                ✨ AudioBoost
            </div>

            <audio controls preload="none">
                <source
                    src="Eve-leve-toi_AudioBoost_Demo.mp3"
                    type="audio/mpeg">
                Votre navigateur ne prend pas en charge la lecture audio.
            </audio>

        </div>


        <a
            class="demo-buy"
            href="https://buy.stripe.com/aFafZb0cS4Aq2C83UogrS01">
            Acheter AudioBoost
        </a>

    </div>

</div>


<script>
function openDemo(){
    document
        .getElementById("demoOverlay")
        .classList.add("active");
}

function closeDemo(){
    document
        .getElementById("demoOverlay")
        .classList.remove("active");
}

function closeDemoOutside(event){
    if(event.target.id === "demoOverlay"){
        closeDemo();
    }
}

document.addEventListener("keydown", function(event){
    if(event.key === "Escape"){
        closeDemo();
    }
});
</script>

</body>
</html>
